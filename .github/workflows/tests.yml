name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r windows/requirements.txt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r linux/requirements.txt
      - name: Run Windows source tests
        run: python -m unittest discover -s windows/tests -v
      - name: Run Linux source tests
        run: python -m unittest discover -s linux/tests -v
